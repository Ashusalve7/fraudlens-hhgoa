services:
  - type: web
    name: fraudlens-api
    runtime: python
    plan: free
    pythonVersion: 3.12.10
    rootDir: fraudlens
    buildCommand: python -m pip install --upgrade uv && uv sync --all-groups --frozen
    startCommand: uv run uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TG_HOST
        sync: false
      - key: TG_SECRET
        sync: false
      - key: TG_GRAPHNAME
        value: FraudGraph
      - key: FRAUDLENS_ALLOWED_ORIGINS
        sync: false
      - key: FRAUDLENS_API_TOKEN
        sync: false
