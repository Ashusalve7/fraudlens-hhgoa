[project]
name = "fraudlens"
version = "0.2.0"
description = "Agentic fraud investigation workspace built on TigerGraph for HHGOA 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mcp>=1.12,<2",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "pytigergraph==2.0.4",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:fraudlens.*",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
